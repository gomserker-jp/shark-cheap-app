name: SharkCheapApp
options:
  minimumXcodeGenVersion: 2.39.0
  deploymentTarget:
    iOS: "18.2"

configs:
  Debug: debug
  Release: release

settingGroups:
  appBase:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: $(TEAM_ID)
    PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_FILE: SharkCheapApp/Info.plist
    DEVELOPMENT_ASSET_PATHS: "\"SharkCheapApp/Preview Content\""
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/Frameworks"
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: "YES"
    MARKETING_VERSION: $(MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)

targets:
  SharkCheapApp:
    type: application
    platform: iOS
    sources:
      - path: SharkCheapApp
        excludes:
          - Info.plist
    configFiles:
      Debug: Configuration/Config.xcconfig
      Release: Configuration/Config.xcconfig
    settings:
      groups:
        - appBase
    preBuildScripts:
      - name: Compile Kotlin Framework
        shell: /bin/sh
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi

          # Ensure Java is discoverable when Xcode runs with a minimal environment.
          if [ -z "$JAVA_HOME" ]; then
            JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null)"
            export JAVA_HOME
          fi
          if [ -n "$JAVA_HOME" ]; then
            export PATH="$JAVA_HOME/bin:$PATH"
          fi

          cd "$SRCROOT/.."
          ./gradlew :sharedLogic:embedAndSignAppleFrameworkForXcode
