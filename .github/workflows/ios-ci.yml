name: iOS CI

on:
  push:
    branches:
      - master
      - 'develop*'
  pull_request:
    branches:
      - master
      - 'develop*'

jobs:
  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run iOS CI lane
        run: bundle exec fastlane ios ci

